appId: app.statocyst.desktop
productName: Statocyst
copyright: Copyright © 2026 Statocyst contributors
directories:
  output: release
  buildResources: resources/icons
files:
  - dist/apps/desktop/**/*
  - dist/apps/desktop-electron/**/*
  - resources/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/@libsql/**/*
  - node_modules/libsql/**/*
npmRebuild: false
electronVersion: 45.0.0
artifactName: statocyst-${version}-${os}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: resources/icons/statocyst-512.png
  executableName: statocyst
  syncDesktopName: true
  maintainer: Statocyst contributors <statocyst@users.noreply.github.com>
  vendor: Statocyst
  synopsis: Local-first, Jellyfin-oriented music player
  description: Statocyst is a local-first music player for imported audio and Jellyfin libraries.
win:
  target:
    - nsis
  icon: resources/icons/statocyst-512.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.music
  icon: resources/icons/statocyst-512.png
  # No signing identity in CI: build an unsigned app. Users open it with
  # right-click → Open the first time. Add a Developer ID + notarization later.
  identity: null

