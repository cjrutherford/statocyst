name: Release

# Two release paths, neither of which creates or approves a pull request:
# - Push a tag like v1.4.0 (it must match versionName in android/app/build.gradle).
# - Merge to main (or run this workflow manually): a unique prerelease tag
#   v<versionName>-merge.<run_number> is created at the merge commit, so every merge
#   produces downloadable APK/AAB/IPA assets without a version-bump PR.
# The signed APK, the signed Play AAB, the R8 mapping file and checksums are attached to a GitHub
# Release for that tag. If PLAY_SERVICE_ACCOUNT_JSON is set, a *tagged* release is also uploaded to
# the Play internal testing track (merge builds skip Play because the versionCode is unchanged).
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  # Create the tag/release and upload assets. Deliberately no pull-requests permission:
  # the workflow never creates, approves or comments on a PR.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public fingerprint of the release signing certificate; a build signed with any other key is refused.
  # Override with the repository variable EXPECTED_CERT_SHA256 (Settings > Variables) if the signing
  # key changes, for example when an upload key different from the sideload key is used for Play.
  EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 || '7d850daeb5e087ff221cc8ae9c590c2d2b381c7c911c069ee148fda8ee7be416' }}

jobs:
  apk:
    name: Build, sign and publish the APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      name: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag and app version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' android/app/build.gradle)
          code=$(sed -n 's/^ *versionCode \([0-9][0-9]*\)$/\1/p' android/app/build.gradle)
          if [[ -z "$name" || -z "$code" ]]; then echo "::error::could not read versionName/versionCode"; exit 1; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" != "v$name" ]]; then
              echo "::error::tag $tag does not match versionName $name in android/app/build.gradle"; exit 1
            fi
            title="Statocyst $name"
          else
            # Merge/manual builds keep the app version but get a unique tag so repeated
            # merges never try to move an existing release.
            tag="v$name-merge.${GITHUB_RUN_NUMBER}"
            title="Statocyst $name (merge build ${GITHUB_RUN_NUMBER})"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets are configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then echo "::error::missing repository secret for $v (see android/RELEASING.md, 'CI release')"; exit 1; fi
          done

      - uses: ./.github/actions/setup-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Generate audio fixtures (needs ffmpeg)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
          pnpm run fixtures
      - name: Typecheck and test
        run: >
          pnpm exec nx run-many -t typecheck test
          -p contracts playback-core persistence media-library jellyfin-client desktop desktop-electron

      - name: Build web assets and sync them into the Android project
        run: |
          pnpm exec nx build desktop --skip-nx-cache
          pnpm exec cap sync android

      - name: Install the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Unit tests, release lint, signed release APK and AAB
        working-directory: android
        run: ./gradlew --console=plain testDebugUnitTest lintVitalRelease assembleRelease bundleRelease

      - name: Verify the signatures
        id: apk
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs" | head -3
          actual=$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK is signed with an unexpected certificate ($actual)"; exit 1
          fi
          # The AAB carries a JAR signature; compare its certificate fingerprint too.
          aab_actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          if [[ "$aab_actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::AAB is signed with an unexpected certificate ($aab_actual)"; exit 1
          fi
          name="${{ steps.version.outputs.name }}"
          mkdir -p dist-release
          cp "$apk" "dist-release/statocyst-$name.apk"
          cp "$aab" "dist-release/statocyst-$name.aab"
          # R8 mapping: upload to Play Console (App bundle explorer) to de-obfuscate crash reports.
          cp android/app/build/outputs/mapping/release/mapping.txt "dist-release/statocyst-$name-mapping.txt"
          (cd dist-release && sha256sum "statocyst-$name.apk" "statocyst-$name.aab" > SHA256SUMS && cat SHA256SUMS)

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: statocyst-release
          path: dist-release/*

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          flags=(--generate-notes --title "$TITLE")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$GITHUB_SHA")
          fi
          # A suffix means a pre-release (merge build or -rc tag); full vN.N.N stays stable.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist-release/* "${flags[@]}"

  ipa:
    name: Build and attach sideload iOS IPA
    needs: apk
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: Build web assets and sync them into the iOS project
        run: |
          pnpm exec nx build desktop --skip-nx-cache
          pnpm exec cap sync ios
      - name: Build iOS Release and package IPA
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build
          name="${{ needs.apk.outputs.name }}"
          mkdir -p ios/build-device/Payload dist-ios
          cp -R ios/build-device/Build/Products/Release-iphoneos/App.app ios/build-device/Payload/App.app
          codesign --force --deep --sign - ios/build-device/Payload/App.app
          (cd ios/build-device && zip -qr "$GITHUB_WORKSPACE/dist-ios/statocyst-$name.ipa" Payload)
          (cd dist-ios && shasum -a 256 "statocyst-$name.ipa" > "statocyst-$name.ipa.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: statocyst-ios-release
          path: dist-ios/*
      - name: Upload IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.apk.outputs.tag }}" dist-ios/* --clobber

  electron:
    name: Electron installers (${{ matrix.target }})
    needs: apk
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-15
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: Ensure the Electron binary is available to electron-builder
        shell: bash
        run: |
          if [ ! -d node_modules/electron/dist ]; then
            node node_modules/electron/install.js
          fi
      - name: Build web and Electron bundles
        shell: bash
        env:
          NODE_ENV: production
        run: |
          pnpm exec nx build desktop --skip-nx-cache
          node tools/build-electron.mjs
      - name: Package Linux installers
        if: matrix.target == 'linux'
        shell: bash
        run: pnpm exec electron-builder --linux AppImage deb --config electron-builder.yml --publish never
      - name: Package Windows installer
        if: matrix.target == 'win'
        shell: bash
        run: pnpm exec electron-builder --win nsis --config electron-builder.yml --publish never
      - name: Package macOS installer
        if: matrix.target == 'mac'
        shell: bash
        run: pnpm exec electron-builder --mac dmg zip --config electron-builder.yml --publish never
      - name: Collect installers and checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist-release
          shopt -s nullglob
          files=(release/*.AppImage release/*.deb release/*.exe release/*.dmg release/*.zip)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::electron-builder produced no installer"; exit 1; fi
          cp "${files[@]}" dist-release/
          cd dist-release
          if command -v sha256sum >/dev/null; then
            sha256sum * > "SHA256SUMS-electron-${TARGET}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-electron-${TARGET}.txt"
          fi
          cat "SHA256SUMS-electron-${TARGET}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: statocyst-electron-${{ matrix.target }}
          path: dist-release/*
      - name: Upload installers to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.apk.outputs.tag }}" dist-release/* --clobber

  play-internal:
    name: Upload the AAB to the Play internal track
    needs: apk
    # Merge builds reuse the same versionCode; Play would reject a duplicate. Only
    # versioned tag releases go to Play.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Skip when Play credentials are not configured
        if: env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo "PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Play upload."
      - uses: actions/download-artifact@v4
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        with:
          name: statocyst-release
          path: dist-release
      - uses: r0adkll/upload-google-play@v1
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hopefulaspirationsindustries.statocyst
          releaseFiles: dist-release/*.aab
          mappingFile: dist-release/statocyst-${{ needs.apk.outputs.name }}-mapping.txt
          track: internal
          status: draft
