name: Release

# Push a tag like v1.4.0 (it must match versionName in android/app/build.gradle).
# The signed APK, the signed Play AAB, the R8 mapping file and checksums are attached to a GitHub
# Release for that tag. If PLAY_SERVICE_ACCOUNT_JSON is set, the AAB is also uploaded to the Play
# internal testing track.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public fingerprint of the release signing certificate; a build signed with any other key is refused.
  # Override with the repository variable EXPECTED_CERT_SHA256 (Settings > Variables) if the signing
  # key changes, for example when an upload key different from the sideload key is used for Play.
  EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 || '7d850daeb5e087ff221cc8ae9c590c2d2b381c7c911c069ee148fda8ee7be416' }}

jobs:
  apk:
    name: Build, sign and publish the APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the app version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' android/app/build.gradle)
          code=$(sed -n 's/^ *versionCode \([0-9][0-9]*\)$/\1/p' android/app/build.gradle)
          tag="${GITHUB_REF_NAME}"
          if [[ -z "$name" || -z "$code" ]]; then echo "::error::could not read versionName/versionCode"; exit 1; fi
          if [[ "$tag" != "v$name" ]]; then
            echo "::error::tag $tag does not match versionName $name in android/app/build.gradle"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets are configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then echo "::error::missing repository secret for $v (see android/RELEASING.md, 'CI release')"; exit 1; fi
          done

      - uses: ./.github/actions/setup-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Generate audio fixtures (needs ffmpeg)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
          pnpm run fixtures
      - name: Typecheck and test
        run: >
          pnpm exec nx run-many -t typecheck test
          -p contracts playback-core persistence media-library jellyfin-client desktop desktop-electron

      - name: Build web assets and sync them into the Android project
        run: |
          pnpm exec nx build desktop --skip-nx-cache
          pnpm exec cap sync android

      - name: Install the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Unit tests, release lint, signed release APK and AAB
        working-directory: android
        run: ./gradlew --console=plain testDebugUnitTest lintVitalRelease assembleRelease bundleRelease

      - name: Verify the signatures
        id: apk
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs" | head -3
          actual=$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK is signed with an unexpected certificate ($actual)"; exit 1
          fi
          # The AAB carries a JAR signature; compare its certificate fingerprint too.
          aab_actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          if [[ "$aab_actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::AAB is signed with an unexpected certificate ($aab_actual)"; exit 1
          fi
          name="${{ steps.version.outputs.name }}"
          mkdir -p dist-release
          cp "$apk" "dist-release/statocyst-$name.apk"
          cp "$aab" "dist-release/statocyst-$name.aab"
          # R8 mapping: upload to Play Console (App bundle explorer) to de-obfuscate crash reports.
          cp android/app/build/outputs/mapping/release/mapping.txt "dist-release/statocyst-$name-mapping.txt"
          (cd dist-release && sha256sum "statocyst-$name.apk" "statocyst-$name.aab" > SHA256SUMS && cat SHA256SUMS)

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: statocyst-release
          path: dist-release/*

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title "Statocyst ${{ steps.version.outputs.name }}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist-release/* "${flags[@]}"

  play-internal:
    name: Upload the AAB to the Play internal track
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Skip when Play credentials are not configured
        if: env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo "PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Play upload."
      - uses: actions/download-artifact@v4
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        with:
          name: statocyst-release
          path: dist-release
      - uses: r0adkll/upload-google-play@v1
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hopefulaspirationsindustries.statocyst
          releaseFiles: dist-release/*.aab
          mappingFile: dist-release/statocyst-${{ needs.apk.outputs.name }}-mapping.txt
          track: internal
          status: draft
