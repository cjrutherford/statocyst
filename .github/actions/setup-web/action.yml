name: Set up web workspace
description: Node (from .node-version), pnpm (from packageManager) and a frozen-lockfile install.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      shell: bash
      env:
        # Only the desktop shell needs the Electron binary; CI never launches it.
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      run: pnpm install --frozen-lockfile
