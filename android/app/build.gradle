apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.kapt'

// Release signing is opt-in. Provide the key either as android/keystore.properties (git-ignored)
// with storeFile/storePassword/keyAlias/keyPassword, or as the environment variables
// STATOCYST_STORE_FILE / STATOCYST_STORE_PASSWORD / STATOCYST_KEY_ALIAS / STATOCYST_KEY_PASSWORD.
// Without either, `assembleRelease` and `bundleRelease` still build, but unsigned, and debug
// installs keep working.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def signingValue = { String prop, String env -> keystoreProperties[prop] ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'STATOCYST_STORE_FILE')
def hasReleaseSigning = releaseStoreFile != null &&
        signingValue('storePassword', 'STATOCYST_STORE_PASSWORD') != null &&
        signingValue('keyAlias', 'STATOCYST_KEY_ALIAS') != null &&
        signingValue('keyPassword', 'STATOCYST_KEY_PASSWORD') != null

android {
    namespace = "net.christopherrutherford.statocyst"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hopefulaspirationsindustries.statocyst"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 27
        versionName "1.9.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'STATOCYST_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'STATOCYST_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'STATOCYST_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8 shrinks and obfuscates; keep rules live in proguard-rules.pro. The mapping file is
            // written to app/build/outputs/mapping/release/ and must be uploaded to Play Console.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    bundle {
        // Play serves per-device splits; keep every language so in-app locale changes work.
        language { enableSplit = false }
    }
    lint {
        // Release lint is a gate for Play-blocking problems, not style.
        abortOnError true
        checkReleaseBuilds true
    }
}

configurations.all {
    // Old kotlin-stdlib-jdk7/jdk8 artifacts (1.6.x) pulled by test deps duplicate
    // classes now bundled inside kotlin-stdlib (>= 1.8). Drop the legacy stubs.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'

    resolutionStrategy {
        // Force Kotlin stdlib to the version used by the app/KGP to avoid
        // cross-version stdlib jars on classpaths (prevents duplicate classes).
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Media3 (AndroidX media playback)
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"

    // Room (Android SQLite)
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"

    // Encrypted SharedPreferences
    implementation "androidx.security:security-crypto:$securityCryptoVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
